[project]
name = "digital-club"
version = "0.1.0"
description = "University tech club platform (Flask)"
readme = "README.md"
requires-python = ">=3.12"

# Pinned to match requirements.txt. Unpinned ranges previously let a rebuild
# install SQLAlchemy 2.1, which changed the default Postgres driver and broke
# the deploy while local environments stayed on 2.0. Bump deliberately, in both
# files, and test before deploying.
dependencies = [
    "flask==3.1.2",
    "werkzeug==3.1.3",
    "jinja2==3.1.6",
    "flask-login==0.6.3",
    "flask-wtf==1.2.2",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.44",
    "flask-migrate==4.1.0",
    "alembic==1.16.5",
    "psycopg[binary]==3.3.9",
    "psycopg2-binary==2.9.11",
    "pillow==11.3.0",
    "qrcode[pil]==8.2",
    "reportlab==4.4.5",
    "cairosvg==2.8.2",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "cryptography==48.0.0",
    "gunicorn==27.0.1",
]

[project]
name = "digital-club"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.1",
    "flask-migrate>=4.0.5",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0",
    "requests>=2.32.5",
    "qrcode[pil]>=7.4.2",
    "cairosvg>=2.8.2",
    # Both Postgres drivers are installed on purpose. SQLAlchemy 2.1 changed the
    # default driver for a bare "postgresql://" URL from psycopg2 to psycopg v3,
    # and managed Postgres providers hand out bare postgresql:// URLs. Keeping
    # psycopg2-binary as well means explicit "postgresql+psycopg2://" URLs
    # (as used by the docker-compose setup) keep working.
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9.9",
    "reportlab>=4.0.0",
    "rq>=1.16.2",
    "redis>=5.2.1",
    "cryptography>=44.0.0",
    "celery>=5.4.0",
]
